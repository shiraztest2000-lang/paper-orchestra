name: SHZ Cloud Gateway Validation
on:
  workflow_dispatch:
  push:
    branches: [shz-paperorchestra-windows]
    paths:
      - "cloud_gateway/**"
      - ".github/workflows/cloud-gateway.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gateway dependencies
        run: python -m pip install -r cloud_gateway/requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q cloud_gateway
      - name: Build gateway container
        run: docker build -t shz-paperorchestra-gateway:ci cloud_gateway
