name: Windows Desktop Portable Build
on:
  workflow_dispatch:
  push:
    branches: [shz-paperorchestra-windows]
    paths: [desktop_app.py, desktop/**, methods/**, utils/**, templates/**, paper_writing_cli.py, requirements.txt, tests/**, .github/workflows/windows-desktop.yml]
concurrency:
  group: shz-paperorchestra-windows-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r desktop/requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q desktop_app.py paper_writing_cli.py methods utils autoraters
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build portable application folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name SHZPaperOrchestra --collect-all google.genai --collect-all openai --collect-all keyring --collect-all win32ctypes --collect-all matplotlib --collect-all cv2 --collect-all fitz --collect-submodules methods --collect-submodules utils --add-data "methods;methods" --add-data "utils;utils" --add-data "templates;templates" --add-data "autoraters;autoraters" --add-data "paper_writing_cli.py;." desktop_app.py
          if (-not (Test-Path "dist/SHZPaperOrchestra/SHZPaperOrchestra.exe")) {
            throw "Portable executable was not created."
          }
          New-Item -ItemType Directory -Force -Path "dist-portable" | Out-Null
          Compress-Archive -Path "dist/SHZPaperOrchestra/*" -DestinationPath "dist-portable/SHZ-PaperOrchestra-Windows-x64-Portable.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v7
        with:
          name: SHZ-PaperOrchestra-Windows-x64-Portable
          path: dist-portable/SHZ-PaperOrchestra-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 30
