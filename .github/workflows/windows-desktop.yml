name: Windows Desktop Build
on:
  workflow_dispatch:
  push:
    branches: [shz-paperorchestra-windows]
    paths: [desktop_app.py, desktop/**, methods/**, utils/**, templates/**, paper_writing_cli.py, requirements.txt, .github/workflows/windows-desktop.yml]
concurrency:
  group: shz-paperorchestra-windows-build
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r desktop/requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q desktop_app.py paper_writing_cli.py methods utils autoraters
      - name: Build app
        shell: pwsh
        run: pyinstaller --noconfirm --clean --windowed --onedir --name SHZPaperOrchestra --collect-all google.genai --collect-all openai --collect-all matplotlib --collect-all cv2 --collect-all fitz --collect-submodules methods --collect-submodules utils --add-data "methods;methods" --add-data "utils;utils" --add-data "templates;templates" --add-data "autoraters;autoraters" --add-data "paper_writing_cli.py;." desktop_app.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        run: iscc desktop/installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: SHZ-PaperOrchestra-Windows-x64
          path: dist-installer/*.exe
          if-no-files-found: error
          retention-days: 30
